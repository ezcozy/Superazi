<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>SuperAzi Arena - Trading Interface</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #111111;
    --bg-card: #161616;
    --bg-card-hover: #1e1e1e;
    --accent-red: #e60026;
    --accent-red-dim: rgba(230,0,38,0.15);
    --accent-red-bright: rgba(230,0,38,0.4);
    --text-primary: #f0f0f0;
    --text-secondary: #888888;
    --text-dim: #4a4a4a;
    --border: rgba(230,0,38,0.15);
    --border-bright: rgba(230,0,38,0.4);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
  }

  /* ─── TOP BAR ─── */
  .top-bar {
    height:56px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px;
    flex-shrink:0;
  }
  .top-bar-left { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .logo {
    font-family:'Orbitron',sans-serif;
    font-weight:900; font-size:0.9rem;
    color: #fff;
    letter-spacing:2px;
    white-space:nowrap;
  }
  .pair-selector {
    display:flex; gap:6px;
  }
  .pair-btn {
    background: transparent;
    border:1px solid var(--border);
    color: var(--text-secondary);
    padding:5px 12px; border-radius:4px;
    font-family:'Rajdhani',sans-serif; font-size:0.7rem;
    font-weight:600; cursor:pointer;
    transition: all 0.2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pair-btn:hover {
    border-color: var(--border-bright);
    color: var(--text-primary);
    transform: translateY(-1px);
  }
  .pair-btn:active {
    transform: translateY(0);
  }
  .pair-btn.active {
    border-color: var(--accent-red);
    color: var(--accent-red);
    background: var(--accent-red-dim);
    font-weight:700;
  }

  .top-bar-right { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .stat-pill {
    display:flex; flex-direction:column;
    font-size:0.65rem;
  }
  .stat-pill .label { color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; }
  .stat-pill .value {
    font-family:'Orbitron',sans-serif;
    font-weight:700; font-size:0.8rem;
    color: #fff;
  }
  .stat-pill .value.positive { color: #fff; }
  .stat-pill .value.negative { color: var(--accent-red); }

  .wallet-badge {
    background: var(--accent-red-dim);
    border:1px solid var(--border-bright);
    padding:6px 12px;
    border-radius:4px;
    font-family:'Share Tech Mono',monospace;
    font-size:0.68rem;
    color: var(--accent-red);
    cursor:pointer;
    transition: all 0.2s;
  }
  .wallet-badge:hover {
    background: var(--accent-red);
    color: #fff;
  }

  /* ─── MAIN LAYOUT ─── */
  .trading-layout {
    display:grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: 1fr 220px;
    height: calc(100vh - 56px);
    gap:1px;
    background: var(--border);
  }

  /* CHART AREA */
  .chart-area {
    background: var(--bg-primary);
    position:relative;
    overflow:hidden;
  }
  #tradingview_chart {
    width:100%; height:100%;
  }

  /* ORDER PANEL */
  .order-panel {
    background: var(--bg-secondary);
    padding:14px;
    overflow-y:auto;
  }
  .order-panel h3 {
    font-family:'Orbitron',sans-serif;
    font-size:0.72rem; font-weight:700;
    letter-spacing:1px; text-transform:uppercase;
    margin-bottom:14px;
    color: #fff;
  }

  .order-tabs {
    display:flex; gap:6px; margin-bottom:14px;
  }
  .order-tab {
    flex:1;
    background: transparent;
    border:1px solid var(--border);
    color: var(--text-secondary);
    padding:7px;
    font-family:'Rajdhani',sans-serif;
    font-size:0.68rem; font-weight:600;
    cursor:pointer; transition: all 0.2s;
    text-transform:uppercase; letter-spacing:1px;
    border-radius:4px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .order-tab:hover {
    border-color: var(--border-bright);
    transform: translateY(-1px);
  }
  .order-tab:active {
    transform: translateY(0);
  }
  .order-tab.active {
    background: var(--accent-red);
    border-color: var(--accent-red);
    color: #fff;
    font-weight:700;
  }
  .order-tab.short.active {
    background: var(--bg-primary);
    border-color: var(--accent-red);
    color: var(--accent-red);
    font-weight:700;
  }

  .input-group {
    margin-bottom:10px;
  }
  .input-group label {
    display:block;
    font-size:0.65rem; font-weight:600;
    color: var(--text-dim);
    letter-spacing:1px; text-transform:uppercase;
    margin-bottom:5px;
  }
  .input-group input,
  .input-group select {
    width:100%;
    background: var(--bg-primary);
    border:1px solid var(--border);
    color: var(--text-primary);
    padding:8px 10px;
    font-family:'Share Tech Mono',monospace;
    font-size:0.75rem;
    border-radius:4px;
  }
  .input-group input:focus,
  .input-group select:focus {
    outline:none;
    border-color: var(--border-bright);
  }

  .leverage-slider {
    display:flex; align-items:center; gap:8px;
  }
  .leverage-slider input[type="range"] {
    flex:1;
    height:8px;
    background: var(--bg-primary);
    border:1px solid var(--border);
    border-radius:4px;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    outline: none;
    padding: 8px 0; /* Increase touch area */
    margin: -8px 0; /* Compensate for padding */
  }
  .leverage-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width:24px; height:24px;
    background: var(--accent-red);
    border-radius:50%;
    cursor:pointer;
    border:3px solid #fff;
    box-shadow: 0 2px 8px rgba(230,0,38,0.4);
    transition: all 0.2s;
  }
  .leverage-slider input[type="range"]::-webkit-slider-thumb:active {
    transform: scale(1.2);
    box-shadow: 0 4px 12px rgba(230,0,38,0.6);
  }
  .leverage-slider input[type="range"]::-moz-range-thumb {
    width:24px; height:24px;
    background: var(--accent-red);
    border-radius:50%;
    cursor:pointer;
    border:3px solid #fff;
    box-shadow: 0 2px 8px rgba(230,0,38,0.4);
    transition: all 0.2s;
  }
  .leverage-slider input[type="range"]::-moz-range-thumb:active {
    transform: scale(1.2);
    box-shadow: 0 4px 12px rgba(230,0,38,0.6);
  }
  .leverage-slider input[type="range"]::-webkit-slider-runnable-track {
    background: var(--bg-primary);
    height: 8px;
    border-radius:4px;
    border:1px solid var(--border);
  }
  .leverage-slider input[type="range"]::-moz-range-track {
    background: var(--bg-primary);
    height: 8px;
    border-radius:4px;
    border:1px solid var(--border);
  }
  .leverage-slider .lev-value {
    font-family:'Orbitron',sans-serif;
    font-weight:700; font-size:0.8rem;
    color: var(--accent-red);
    min-width:34px;
  }

  .order-btn {
    width:100%;
    background: var(--accent-red);
    border:none;
    color: #fff;
    padding:10px;
    font-family:'Orbitron',sans-serif;
    font-size:0.68rem; font-weight:700;
    letter-spacing:2px; text-transform:uppercase;
    cursor:pointer;
    margin-top:14px;
    transition: all 0.2s;
    border-radius:4px;
  }
  .order-btn:hover {
    background: #ff0030;
  }
  .order-btn:disabled {
    opacity:0.5;
    cursor:not-allowed;
  }
  .order-btn.short {
    background: var(--bg-primary);
    border:1px solid var(--accent-red);
    color: var(--accent-red);
  }
  .order-btn.short:hover {
    background: var(--accent-red-dim);
  }

  /* POSITIONS PANEL */
  .positions-panel {
    background: var(--bg-secondary);
    grid-column: 1 / -1;
    padding:14px;
    overflow-y:auto;
  }
  .positions-tabs {
    display:flex; gap:16px; margin-bottom:12px;
    border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  .pos-tab {
    background: transparent;
    border:none;
    color: var(--text-dim);
    padding:7px 0;
    font-family:'Rajdhani',sans-serif;
    font-size:0.68rem; font-weight:600;
    cursor:pointer;
    text-transform:uppercase; letter-spacing:1px;
    border-bottom:2px solid transparent;
    transition: all 0.2s;
    white-space:nowrap;
  }
  .pos-tab.active {
    color: var(--accent-red);
    border-bottom-color: var(--accent-red);
  }

  .positions-table {
    width:100%;
    font-size:0.7rem;
    overflow-x:auto;
    display:block;
  }
  .positions-table table {
    width:100%;
    border-collapse:collapse;
  }
  .positions-table th {
    text-align:left;
    color: var(--text-dim);
    font-weight:600;
    letter-spacing:1px; text-transform:uppercase;
    padding:7px 10px;
    border-bottom:1px solid var(--border);
  }
  .positions-table td {
    padding:9px 10px;
    color: var(--text-secondary);
    border-bottom:1px solid var(--border);
  }
  .positions-table .pnl {
    font-family:'Share Tech Mono',monospace;
    font-weight:600;
  }
  .positions-table .pnl.pos { color: #fff; }
  .positions-table .pnl.neg { color: var(--accent-red); }

  .empty-state {
    text-align:center;
    padding:40px 20px;
    color: var(--text-dim);
  }
  .empty-state .icon {
    font-size:1.8rem; margin-bottom:10px;
    opacity:0.3;
  }
  .empty-state p {
    font-size:0.72rem;
  }

  /* ─── MOBILE RESPONSIVE ─── */
  @media(max-width:1024px){
    .trading-layout {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 260px 180px;
    }
    .order-panel {
      grid-row: 2;
      grid-column: 1;
    }
  }

  @media(max-width:768px){
    .top-bar {
      padding:0 12px;
      height:auto;
      min-height:54px;
      flex-wrap:wrap;
      gap:8px;
    }
    .top-bar-left {
      gap:12px;
      width:100%;
      justify-content:space-between;
    }
    .top-bar-right {
      gap:10px;
      width:100%;
      justify-content:space-between;
      padding-bottom:8px;
    }
    .logo { font-size:0.8rem; }
    .pair-btn { padding:4px 10px; font-size:0.65rem; }
    .stat-pill { font-size:0.6rem; }
    .stat-pill .value { font-size:0.75rem; }
    .wallet-badge { font-size:0.62rem; padding:5px 10px; }
    
    .trading-layout {
      grid-template-rows: 1fr 240px 160px;
      height: calc(100vh - 100px);
    }
    
    .order-panel {
      padding:12px;
    }
    .order-panel h3 { font-size:0.68rem; margin-bottom:10px; }
    .input-group { margin-bottom:8px; }
    .input-group label { font-size:0.6rem; }
    .input-group input { padding:7px 8px; font-size:0.7rem; }
    .order-btn { padding:9px; font-size:0.64rem; }
    
    .positions-panel {
      padding:12px;
    }
    .positions-tabs { gap:12px; }
    .pos-tab { font-size:0.64rem; }
    .positions-table { font-size:0.65rem; }
    .positions-table th, .positions-table td { padding:6px 8px; }
  }

  @media(max-width:480px){
    .trading-layout {
      grid-template-rows: 1fr 220px 140px;
    }
    .pair-selector {
      overflow-x:auto;
      width:100%;
    }
    .stat-pill {
      flex: 1;
      min-width:70px;
    }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-bar-left">
    <div class="logo" style="display:flex;align-items:center;gap:8px;">
      <img src="logo.jpg" alt="SuperAzi" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-red);" />
      <span>SUPERAZI</span>
    </div>
    <div class="pair-selector">
      <button class="pair-btn active" data-pair="BTCUSDT">BTC/USDT</button>
      <button class="pair-btn" data-pair="ETHUSDT">ETH/USDT</button>
      <button class="pair-btn" data-pair="SOLUSDT">SOL/USDT</button>
    </div>
  </div>
  <div class="top-bar-right">
    <div class="stat-pill">
      <span class="label">Balance</span>
      <span class="value" id="balance">1,000.00</span>
    </div>
    <div class="stat-pill">
      <span class="label">PnL</span>
      <span class="value positive" id="pnl">+0.00</span>
    </div>
    <div class="stat-pill">
      <span class="label">Rank</span>
      <span class="value" id="rank">&mdash;</span>
    </div>
    <div class="wallet-badge" id="walletBadge" onclick="handleWallet()">Connect</div>
  </div>
</div>

<!-- TRADING LAYOUT -->
<div class="trading-layout">
  
  <!-- CHART AREA -->
  <div class="chart-area">
    <div id="tradingview_chart"></div>
  </div>

  <!-- ORDER PANEL -->
  <div class="order-panel">
    <h3>Place Order</h3>
    
    <div class="order-tabs">
      <button class="order-tab active" data-side="long">Long</button>
      <button class="order-tab short" data-side="short">Short</button>
    </div>

    <div class="input-group">
      <label>Leverage</label>
      <div class="leverage-slider">
        <input type="range" id="leverage" min="1" max="100" value="10" />
        <span class="lev-value"><span id="levValue">10</span>x</span>
      </div>
    </div>

    <div class="input-group">
      <label>Size (USDT)</label>
      <input type="number" id="size" value="100" step="10" />
    </div>

    <div class="input-group">
      <label>Entry Price</label>
      <input type="number" id="entryPrice" placeholder="Market" />
    </div>

    <button class="order-btn" id="orderBtn" onclick="placeOrder()">Open Long Position</button>
  </div>

  <!-- POSITIONS PANEL -->
  <div class="positions-panel">
    <div class="positions-tabs">
      <button class="pos-tab active">Positions (0)</button>
      <button class="pos-tab">Orders (0)</button>
      <button class="pos-tab">History</button>
    </div>

    <div id="positionsContent">
      <div class="empty-state">
        <div class="icon">📊</div>
        <p>No open positions. Place your first trade to get started.</p>
      </div>
    </div>
  </div>

</div>

<!-- SCRIPTS -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
// SUPERAZI TRADING INTERFACE - FIXED VERSION
// ═══════════════════════════════════════════════════════════

console.log('🚀 SuperAzi Trading Interface Loading...');

// ─── GLOBAL STATE ───
let walletConnected = false;
let walletAddress = null;
let chart = null;
let candlestickSeries = null;
let currentPair = 'BTCUSDT';
let orderSide = 'long';
let ws = null;

// ═══════════════════════════════════════════════════════════
// WALLET FUNCTIONS
// ═══════════════════════════════════════════════════════════

async function handleWallet() {
  console.log('Wallet button clicked, connected:', walletConnected);
  if(walletConnected) {
    disconnectWallet();
  } else {
    await connectWallet();
  }
}

async function connectWallet() {
  try {
    const phantom = window.solana;
    
    if(!phantom || !phantom.isPhantom) {
      alert('Phantom wallet not detected. Install from phantom.app');
      window.open('https://phantom.app/', '_blank');
      return;
    }
    
    const resp = await phantom.connect();
    walletAddress = resp.publicKey.toString();
    walletConnected = true;
    
    updateWalletUI();
    console.log('✅ Wallet connected:', walletAddress);
    
  } catch(err) {
    console.error('❌ Wallet connection error:', err);
    alert('Failed to connect wallet');
  }
}

function disconnectWallet() {
  if(window.solana) {
    window.solana.disconnect();
  }
  walletConnected = false;
  walletAddress = null;
  updateWalletUI();
  console.log('🔌 Wallet disconnected');
}

function updateWalletUI() {
  const badge = document.getElementById('walletBadge');
  if(walletConnected && walletAddress) {
    const short = walletAddress.slice(0,4) + '...' + walletAddress.slice(-4);
    badge.textContent = short;
    badge.style.background = 'var(--accent-red-dim)';
    badge.style.color = 'var(--accent-red)';
  } else {
    badge.textContent = 'Connect';
    badge.style.background = 'transparent';
    badge.style.color = 'var(--text-secondary)';
  }
}

// ═══════════════════════════════════════════════════════════
// CHART FUNCTIONS
// ═══════════════════════════════════════════════════════════

function initChart() {
  console.log('📊 Initializing chart...');
  const container = document.getElementById('tradingview_chart');
  
  if(!container) {
    console.error('❌ Chart container not found');
    return;
  }
  
  chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      background: { color: '#0a0a0a' },
      textColor: '#888888',
    },
    grid: {
      vertLines: { color: 'rgba(230,0,38,0.05)' },
      horzLines: { color: 'rgba(230,0,38,0.05)' },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
    },
    rightPriceScale: {
      borderColor: 'rgba(230,0,38,0.15)',
    },
    timeScale: {
      borderColor: 'rgba(230,0,38,0.15)',
      timeVisible: true,
      secondsVisible: false,
    },
  });

  candlestickSeries = chart.addCandlestickSeries({
    upColor: '#ffffff',
    downColor: '#e60026',
    borderUpColor: '#ffffff',
    borderDownColor: '#e60026',
    wickUpColor: '#ffffff',
    wickDownColor: '#e60026',
  });

  // Responsive
  window.addEventListener('resize', () => {
    if(chart) {
      chart.applyOptions({
        width: container.clientWidth,
        height: container.clientHeight,
      });
    }
  });

  console.log('✅ Chart initialized');
  loadChartData(currentPair);
}

async function loadChartData(pair) {
  console.log('📥 Loading chart data for:', pair);
  try {
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=15m&limit=100`);
    const data = await res.json();
    
    const candles = data.map(d => ({
      time: d[0] / 1000,
      open: parseFloat(d[1]),
      high: parseFloat(d[2]),
      low: parseFloat(d[3]),
      close: parseFloat(d[4]),
    }));

    if(candlestickSeries) {
      candlestickSeries.setData(candles);
      const lastPrice = candles[candles.length-1].close;
      document.getElementById('entryPrice').placeholder = `Market: ${lastPrice.toFixed(2)}`;
      console.log('✅ Chart data loaded, last price:', lastPrice);
    }
    
  } catch(err) {
    console.error('❌ Failed to load chart:', err);
  }
}

function connectWebSocket(pair) {
  console.log('🔌 Connecting WebSocket for:', pair);
  
  if(ws) {
    ws.close();
  }
  
  const stream = pair.toLowerCase() + '@kline_15m';
  ws = new WebSocket(`wss://stream.binance.com:9443/ws/${stream}`);
  
  ws.onopen = () => {
    console.log('✅ WebSocket connected');
  };
  
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    const candle = msg.k;
    
    if(candlestickSeries) {
      candlestickSeries.update({
        time: candle.t / 1000,
        open: parseFloat(candle.o),
        high: parseFloat(candle.h),
        low: parseFloat(candle.l),
        close: parseFloat(candle.c),
      });

      const price = parseFloat(candle.c).toFixed(2);
      document.getElementById('entryPrice').placeholder = `Market: ${price}`;
    }
  };
  
  ws.onerror = (err) => {
    console.error('❌ WebSocket error:', err);
  };
}

// ═══════════════════════════════════════════════════════════
// PAIR SWITCHING
// ═══════════════════════════════════════════════════════════

function setupPairButtons() {
  console.log('🔧 Setting up pair buttons...');
  const buttons = document.querySelectorAll('.pair-btn');
  
  buttons.forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      console.log('🔄 Pair clicked:', this.dataset.pair);
      
      // Remove active from all
      buttons.forEach(b => b.classList.remove('active'));
      
      // Add active to this
      this.classList.add('active');
      
      // Update pair
      currentPair = this.dataset.pair;
      
      // Load data
      loadChartData(currentPair);
      connectWebSocket(currentPair);
      
      console.log('✅ Switched to:', currentPair);
    });
  });
  
  console.log('✅ Pair buttons ready:', buttons.length);
}

// ═══════════════════════════════════════════════════════════
// ORDER PANEL - LONG/SHORT TABS
// ═══════════════════════════════════════════════════════════

function setupOrderTabs() {
  console.log('🔧 Setting up order tabs...');
  const tabs = document.querySelectorAll('.order-tab');
  const btn = document.getElementById('orderBtn');
  
  tabs.forEach(tab => {
    tab.addEventListener('click', function(e) {
      e.preventDefault();
      console.log('📊 Order tab clicked:', this.dataset.side);
      
      // Remove active from all
      tabs.forEach(t => t.classList.remove('active'));
      
      // Add active to this
      this.classList.add('active');
      
      // Update side
      orderSide = this.dataset.side;
      
      // Update button
      if(orderSide === 'long') {
        btn.textContent = 'Open Long Position';
        btn.classList.remove('short');
      } else {
        btn.textContent = 'Open Short Position';
        btn.classList.add('short');
      }
      
      console.log('✅ Order side:', orderSide);
    });
  });
  
  console.log('✅ Order tabs ready:', tabs.length);
}

// ═══════════════════════════════════════════════════════════
// LEVERAGE SLIDER
// ═══════════════════════════════════════════════════════════

function setupLeverageSlider() {
  console.log('🔧 Setting up leverage slider...');
  const slider = document.getElementById('leverage');
  const valueDisplay = document.getElementById('levValue');
  
  slider.addEventListener('input', function(e) {
    const value = e.target.value;
    valueDisplay.textContent = value;
    console.log('⚡ Leverage:', value + 'x');
  });
  
  // Set initial value
  valueDisplay.textContent = slider.value;
  console.log('✅ Leverage slider ready');
}

// ═══════════════════════════════════════════════════════════
// PLACE ORDER
// ═══════════════════════════════════════════════════════════

function placeOrder() {
  console.log('📝 Place order clicked');
  
  if(!walletConnected) {
    alert('⚠️ Please connect your wallet first');
    console.log('❌ Wallet not connected');
    return;
  }
  
  const leverage = document.getElementById('leverage').value;
  const size = document.getElementById('size').value;
  const entryPrice = document.getElementById('entryPrice').value || 'Market';
  
  const orderData = {
    wallet: walletAddress,
    side: orderSide,
    pair: currentPair,
    leverage: leverage + 'x',
    size: size + ' USDT',
    entry: entryPrice
  };
  
  console.log('📊 Order:', orderData);

  // TODO: Send to backend API
  // POST /api/orders/create
  
  alert(`✅ ${orderSide.toUpperCase()} order placed!\n\nPair: ${currentPair}\nLeverage: ${leverage}x\nSize: ${size} USDT`);
}

// ═══════════════════════════════════════════════════════════
// MOCK PNL UPDATES
// ═══════════════════════════════════════════════════════════

function startPnLUpdates() {
  setInterval(() => {
    const pnl = (Math.random() - 0.48) * 50;
    const pnlEl = document.getElementById('pnl');
    pnlEl.textContent = (pnl >= 0 ? '+' : '') + pnl.toFixed(2);
    pnlEl.className = 'value ' + (pnl >= 0 ? 'positive' : 'negative');
  }, 3000);
}

// ═══════════════════════════════════════════════════════════
// INITIALIZATION - RUN WHEN PAGE LOADS
// ═══════════════════════════════════════════════════════════

window.addEventListener('DOMContentLoaded', async function() {
  console.log('🎬 DOM Content Loaded');
  
  // Wait a bit for everything to be ready
  setTimeout(() => {
    console.log('🚀 Initializing all components...');
    
    // 1. Setup UI controls first
    setupPairButtons();
    setupOrderTabs();
    setupLeverageSlider();
    
    // 2. Initialize chart
    initChart();
    connectWebSocket(currentPair);
    
    // 3. Start mock updates
    startPnLUpdates();
    
    // 4. Try auto-reconnect wallet
    if(window.solana && window.solana.isConnected) {
      window.solana.connect({ onlyIfTrusted: true })
        .then(resp => {
          walletAddress = resp.publicKey.toString();
          walletConnected = true;
          updateWalletUI();
          console.log('✅ Auto-reconnected wallet:', walletAddress);
        })
        .catch(() => {
          console.log('ℹ️ Auto-reconnect skipped');
        });
    }
    
    console.log('✅ All systems ready!');
  }, 100);
});

console.log('✅ Script loaded');
</script>
